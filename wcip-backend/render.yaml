# Render deployment blueprint (free tier: single web service).
# Create services from this file via the Render dashboard ("New > Blueprint").
services:
  - type: web
    name: wcip-api
    runtime: python
    rootDir: wcip-backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start_render.sh
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      # Supabase Postgres connection string (Connect > Transaction pooler,
      # port 6543, sslmode=require). Set in the Render dashboard; never commit.
      - key: DATABASE_URL
        sync: false
      # Free tier: no Redis/worker. The cache falls back to in-process memory
      # and large simulations run inline instead of on Celery.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      # No paid cron on the free plan: sync FIFA/Elo/results in the background
      # on every start. Free services sleep when idle, so each wake refreshes.
      - key: SYNC_DATA_ON_START
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://world-cup-intelligence-platform.vercel.app
      - key: BACKEND_CORS_ORIGINS
        value: https://world-cup-intelligence-platform.vercel.app
      - key: CORS_ORIGINS
        value: https://world-cup-intelligence-platform.vercel.app
      - key: BACKEND_CORS_ORIGIN_REGEX
        value: https://world-cup-intelligence-platform(?:-[a-z0-9-]+)?\.vercel\.app
      - key: FIFA_RANKING_SOURCE_URL
        value: https://inside.fifa.com/fifa-rankings/world-ranking/men
      - key: ELO_RATING_SOURCE_URL
        value: https://www.eloratings.net/2026_World_Cup
      - key: ELO_RATING_TSV_URL
        value: https://www.eloratings.net/World.tsv

# Database: Supabase Postgres (managed outside Render). See DATABASE_URL above.
# Paid add-ons removed for the free plan: celery worker, wcip-redis, and the
# wcip-data-sync cron (python -m scripts.sync_data every 6h). Restore them from
# git history if you upgrade.
